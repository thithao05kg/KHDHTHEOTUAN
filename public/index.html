<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kế hoạch dạy học theo tuần</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="loginScreen" class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h3><i class="fa-solid fa-sign-in-alt"></i> Đăng nhập</h3>
      </div>
      <form id="frmDangNhap" class="login-form-body">
        <div class="input-group-custom">
          <label>Năm học</label>
          <select id="login_nam" class="form-control" required>
            <option value="">-- Đang tải dữ liệu --</option>
          </select>
        </div>
        <div class="input-group-custom">
          <label>Trường học</label>
          <select id="login_truong" class="form-control" required>
            <option value="">-- Chọn trường học --</option>
          </select>
        </div>
        <div class="input-group-custom">
          <label>Tên đăng nhập (Giáo viên)</label>
          <select id="login_gv" class="form-control" required>
            <option value="">-- Chọn giáo viên --</option>
          </select>
        </div>
        <div class="input-group-custom" style="position: relative;">
          <label>Mật khẩu</label>
          <input type="password" id="login_pass" class="form-control" placeholder="Nhập mật khẩu">
          <i id="togglePass" class="fa-solid fa-eye" style="position: absolute; right: 15px; top: 42px; cursor: pointer;"></i>
        </div>
        <div class="input-group-custom" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="chkNhoDangNhap" style="width: auto;">
          <label for="chkNhoDangNhap" style="margin: 0; cursor: pointer; font-size: 14px;">Ghi nhớ đăng nhập</label>
        </div>
        <button type="submit" class="btn-login-submit">ĐĂNG NHẬP</button>
      </form>
    </div>
  </div>

  <div id="appMainForm" style="display: none;">
    <header class="app-header">
      <div class="header-container">
        <div class="brand-info">
          <h1><i class="fa-solid fa-calendar-days"></i> KẾ HOẠCH DẠY HỌC THEO TUẦN</h1>
          <p>QUẢN LÝ TỰ ĐỘNG - WEB VERSION</p>
        </div>
        <div class="system-info">
          <span class="badge"><i class="fa-solid fa-cloud"></i> Quản lý trực tuyến</span>
          <div style="font-size: 12px; color: #495057;">
            <span id="userDisplayName"></span>
            <button id="btnLogout" class="btn-logout"><i class="fa-solid fa-sign-out-alt"></i> Đăng xuất</button>
          </div>
        </div>
      </div>
    </header>

    <main class="app-container">
      <div class="config-grid">
        <div class="card">
          <div class="card-header">
            <i class="fa-solid fa-sliders"></i> Cấu hình thời gian & nhân sự
          </div>
          <div class="card-body form-grid">
            <div class="form-group">
              <label>Năm học</label>
              <select id="namhoc" class="form-control"></select>
            </div>
            <div class="form-group">
              <label>Trường học</label>
              <select id="truonghoc" class="form-control"></select>
            </div>
            <div class="form-group">
              <label>Ngày bắt đầu năm học</label>
              <input type="text" id="ngaybatdau" class="form-control" placeholder="dd/mm/yyyy">
            </div>
            <div class="form-group">
              <label>Giáo viên</label>
              <select id="giaovien" class="form-control"></select>
            </div>
            <div class="form-group col-span-2-md">
              <div class="time-flex-container">
                <div class="time-flex-item">
                  <label>Tuần thứ</label>
                  <input type="number" id="tuan" class="form-control" value="1" min="1" max="35">
                </div>
                <div class="time-flex-item">
                  <label>Từ ngày (Thứ 2)</label>
                  <input type="text" id="tuan_tungay" class="form-control" readonly>
                </div>
                <div class="time-flex-item">
                  <label>Đến ngày (Thứ 7)</label>
                  <input type="text" id="tuan_denngay" class="form-control" readonly>
                </div>
              </div>
            </div>
            <div class="form-group col-span-2-md">
              <label>Thời gian nghỉ Tết (Từ / Đến)</label>
              <div class="range-group">
                <input type="text" id="tettu" class="form-control" placeholder="dd/mm/yyyy">
                <span class="range-split">giáp</span>
                <input type="text" id="tetden" class="form-control" placeholder="dd/mm/yyyy">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="toolbar-section">
        <div class="button-group">
          <button id="btMoi" class="btn btn-primary"><i class="fa-solid fa-file-circle-plus"></i> Tạo mới</button>
          <button id="btLuu" class="btn btn-success"><i class="fa-solid fa-floppy-disk"></i> Lưu lịch</button>
          <button id="btXemIn" class="btn btn-primary"><i class="fa-solid fa-file-pdf"></i> Xem in</button>
          <button id="btInLich" class="btn btn-primary"><i class="fa-solid fa-print"></i> In tệp</button>
        </div>
      </div>

      <div id="status-bar" class="status-wrapper">
        <span class="status-title">Trạng thái:</span>
        <span id="status">Hệ thống sẵn sàng thao tác.</span>
      </div>

      <div class="card grid-card">
        <div class="card-header">
          <i class="fa-solid fa-table-list"></i> BẢNG NỘI DUNG CHI TIẾT TIẾT DẠY
        </div>
        <div class="card-body grid-wrapper">
          <div id="grid" style="width: 100%; height: 550px;"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="loadingOverlay" style="display: none;" class="loading-overlay">
    <div class="spinner"></div>
    <span id="loadingText">Hệ thống đang tải dữ liệu...</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/vn.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
